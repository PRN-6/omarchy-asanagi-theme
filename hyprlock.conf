# ==============================================================================
# Asanagi Umi (朝凪海) Theme - Hyprlock Config (Omarchy OS / Hyprland)
# ==============================================================================

background {
    monitor =
    path = ~/.config/omarchy/themes/asanagi/backgrounds/default.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 1.05
    brightness = 0.75
    color = rgb(19, 9, 31)
}

# TIME (Large Minimalist Clock - Native Hyprlock $TIME)
label {
    monitor =
    text = $TIME
    color = rgb(250, 245, 255)
    font_size = 90
    font_family = Outfit, JetBrainsMono Nerd Font, sans-serif
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(168, 85, 247, 0.4)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgb(168, 85, 247)
    font_size = 18
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 75
    halign = center
    valign = center
}

# USER AVATAR / PROFILE PIC (Asanagi Artwork)
image {
    monitor =
    path = ~/.config/omarchy/themes/asanagi/backgrounds/avatar.jpg
    size = 120
    rounding = -1 # Circular crop
    border_size = 3
    border_color = rgb(168, 85, 247)
    position = 0, -25
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(168, 85, 247, 0.5)
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    inner_color = rgb(31, 16, 51)
    outer_color = rgb(168, 85, 247)
    font_color = rgb(233, 213, 255)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##9d8ba7">Enter password...</span></i>
    hide_input = false
    check_color = rgb(129, 140, 248)
    fail_color = rgb(244, 63, 110)
    fail_text = <i>Authentication failed ($ATTEMPTS)</i>
    capslock_color = rgb(250, 204, 21)
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(8, 3, 13, 0.6)
}

# GREETING / MINIMALIST LABEL
label {
    monitor =
    text = 朝凪海  •  Asanagi Umi
    color = rgb(157, 139, 167)
    font_size = 11
    font_family = JetBrainsMono Nerd Font, monospace
    position = 0, 30
    halign = center
    valign = bottom
}
